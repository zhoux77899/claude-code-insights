name: Claude Code Plugins Daily Insight

on:
  schedule:
    # Run daily at 00:00 UTC (08:00 Beijing Time)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and validate a snapshot without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily-insight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-insight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.snapshot.outputs.artifact-id }}
      baseline_sha: ${{ steps.checkout.outputs.commit }}

    steps:
      - name: Require main for publication
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref != 'refs/heads/main'
        run: |
          echo '::error::Only main can publish a snapshot. Use dry_run on other branches.'
          exit 1

      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'refs/heads/main' || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and validate snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.generate_daily_insight --baseline plugins --output "$RUNNER_TEMP/daily-insight"

      - name: Upload validated snapshot
        id: snapshot
        uses: actions/upload-artifact@v7
        with:
          name: daily-insight-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily-insight
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: generate-insight
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}

    steps:
      - name: Checkout generation baseline
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.generate-insight.outputs.baseline_sha }}

      - name: Download validated snapshot
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.generate-insight.outputs.artifact_id }}
          path: ${{ runner.temp }}/daily-insight

      - name: Commit and push snapshot
        id: publish
        shell: bash
        env:
          BASELINE_SHA: ${{ needs.generate-insight.outputs.baseline_sha }}
        run: |
          snapshot_paths=(
            plugins/cached-repos.txt
            plugins/history.json
            plugins/plugins-daily-insight.md
            plugins/repos.json
          )

          git fetch --no-tags origin refs/heads/main
          main_sha=$(git rev-parse FETCH_HEAD)
          if ! git diff --quiet "$BASELINE_SHA" "$main_sha" -- \
            .github/workflows/plugins-daily-insight.yml requirements.txt scripts/ "${snapshot_paths[@]}"; then
            echo '::error::Snapshot inputs changed after generation started. Start a fresh run from main.'
            exit 1
          fi

          git switch --detach "$main_sha"
          for path in "${snapshot_paths[@]}"; do
            cp -- "$RUNNER_TEMP/daily-insight/${path##*/}" "$path"
          done
          git add -- "${snapshot_paths[@]}"

          if git diff --cached --quiet; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo 'The validated snapshot matches main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'github-actions[bot]'
          git commit -m "Daily Insight $(date -u +%Y-%m-%d)"
          git push origin HEAD:refs/heads/main
          echo 'published=true' >> "$GITHUB_OUTPUT"
          printf 'Published snapshot commit `%s`.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/github-pages-deploy.yml
